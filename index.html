<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport Bill Generator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    padding:15px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h1,h2{
    text-align:center;
    margin:5px 0;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    font-weight:bold;
    font-size:14px;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    border:0;
    border-radius:9px;
    padding:12px 16px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.add{
    background:#2563eb;
    color:white;
}

.save{
    background:#16a34a;
    color:white;
}

.share{
    background:#25D366;
    color:white;
}

.print{
    background:#111827;
    color:white;
}

.clear{
    background:#dc2626;
    color:white;
}

.student-card{
    border:1px solid #ddd;
    border-radius:12px;
    padding:14px;
    margin-top:10px;
    background:#fff;
}

.student-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.remove{
    background:#fee2e2;
    color:#dc2626;
    padding:8px 12px;
    margin:0;
}

.total{
    border-top:2px solid #ddd;
    margin-top:15px;
    padding-top:15px;
    display:flex;
    justify-content:space-between;
    font-size:21px;
    font-weight:bold;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.receipt{
    background:white;
}

.school-name{
    font-size:22px;
    font-weight:bold;
    text-align:center;
}

.tagline{
    text-align:center;
    color:#555;
    margin-top:5px;
}

.bill-title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin:18px 0;
}

.receipt-row{
    border-bottom:1px solid #ddd;
    padding:10px 0;
}

.saved-bill{
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    margin-top:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

@media(max-width:650px){

    .form-grid,
    .student-grid{
        grid-template-columns:1fr;
    }

}

@media print{

    body{
        background:white;
        padding:0;
    }

    body *{
        visibility:hidden;
    }

    #receipt,
    #receipt *{
        visibility:visible;
    }

    #receipt{
        position:absolute;
        left:0;
        top:0;
        width:100%;
        box-shadow:none;
    }

    .no-print{
        display:none!important;
    }

}
</style>
</head>

<body>

<div class="container">

<div class="card no-print">

<h1>🚌 Transport Bill Generator</h1>

<p class="subtitle">
Multiple Student Bill
</p>

<div class="form-grid">

<div>

<label>
Month

<select id="month">

<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option>September</option>
<option>October</option>
<option>November</option>
<option>December</option>

</select>

</label>

</div>

<div>

<label>
Year

<input
id="year"
type="number"
value="2026"
>

</label>

</div>

<div>

<label>
Driver Name

<input
id="driver"
placeholder="Enter driver name"
>

</label>

</div>

</div>

</div>


<div class="card no-print">

<h2>Students</h2>

<div id="students"></div>

<button
class="add"
onclick="addStudent()"
>
+ Add Student
</button>

</div>


<div
class="card receipt"
id="receipt"
>

<div class="school-name">

AMICHAND SERVODAY CONVENT SCHOOL

</div>

<div class="tagline">

Education • Discipline • Values • Success

</div>

<div class="bill-title">

TRANSPORT FEE BILL

</div>

<div
style="
display:flex;
justify-content:space-between;
margin-bottom:15px
"
>

<div>

Month:
<b id="billMonth">
September 2026
</b>

</div>

<div>

Driver:
<b id="billDriver">
—
</b>

</div>

</div>

<div id="receiptStudents"></div>

<div class="total">

<span>
GRAND TOTAL
</span>

<span id="grandTotal">
₹0
</span>

</div>

<div
style="
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
margin-top:50px;
text-align:center
"
>

<div
style="
border-top:1px solid #555;
padding-top:8px
"
>

Driver Signature

</div>

<div
style="
border-top:1px solid #555;
padding-top:8px
"
>

School Stamp

</div>

</div>

</div>


<div class="card no-print">

<div class="actions">

<button
class="save"
onclick="saveBill()"
>
💾 Save Bill
</button>

<button
class="share"
onclick="shareBill()"
>
📲 Share Bill
</button>

<button
class="print"
onclick="window.print()"
>
🖨️ Print / Save PDF
</button>

<button
class="clear"
onclick="clearAll()"
>
🗑️ Clear
</button>

</div>

</div>


<div class="card no-print">

<h2>
💾 Saved Bills
</h2>

<div id="savedBills">

No bills saved yet.

</div>

</div>

</div>


<script>

let students = [];

let savedBills = [];

try{

savedBills =
JSON.parse(
localStorage.getItem("transportBills") || "[]"
);

if(!Array.isArray(savedBills)){
savedBills=[];
}

}catch(e){

savedBills=[];

}


function escapeHTML(str){

return String(str || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function addStudent(
name="",
cls="",
village="",
fee=""
){

students.push({

name:name,

cls:cls,

village:village,

fee:Number(fee) || 0

});

render();

}


function removeStudent(index){

students.splice(index,1);

render();

}


function render(){

let box =
document.getElementById("students");

box.innerHTML="";


students.forEach(function(s,i){

let card =
document.createElement("div");

card.className="student-card";


card.innerHTML=`

<div class="card-head">

<b>
Student ${i+1}
</b>

<button
class="remove"
onclick="removeStudent(${i})"
>
Remove
</button>

</div>


<div class="student-grid">

<label>

Student Name

<input
value="${escapeHTML(s.name)}"
placeholder="Student name"
oninput="updateStudent(${i},'name',this.value)"
>

</label>


<label>

Class

<input
value="${escapeHTML(s.cls)}"
placeholder="e.g. 5th"
oninput="updateStudent(${i},'cls',this.value)"
>

</label>


<label>

Village

<input
value="${escapeHTML(s.village)}"
placeholder="Village name"
oninput="updateStudent(${i},'village',this.value)"
>

</label>


<label>

Monthly Fee (₹)

<input
type="number"
min="0"
value="${s.fee}"
placeholder="1500"
oninput="updateStudent(${i},'fee',this.value)"
>

</label>

</div>

`;

box.appendChild(card);

});


updateReceipt();

}


function updateStudent(
index,
key,
value
){

if(key==="fee"){

students[index][key] =
Number(value) || 0;

}else{

students[index][key] =
value;

}

updateReceipt();

}


function updateReceipt(){

let total=0;

let receipt =
document.getElementById(
"receiptStudents"
);

receipt.innerHTML="";


students.forEach(function(s,i){

total +=
Number(s.fee) || 0;


let row =
document.createElement("div");

row.className="receipt-row";


row.innerHTML=`

<div
style="
display:flex;
justify-content:space-between;
gap:10px
"
>

<b>

${i+1}.
${escapeHTML(s.name) || "—"}

</b>

<b>

₹${Number(s.fee || 0)
.toLocaleString("en-IN")}

</b>

</div>


<div
style="
color:#666;
font-size:14px;
margin-top:4px
"
>

Class:
${escapeHTML(s.cls) || "—"}

&nbsp; · &nbsp;

Village:
${escapeHTML(s.village) || "—"}

</div>

`;


receipt.appendChild(row);

});


document.getElementById(
"grandTotal"
).innerText =
"₹" +
total.toLocaleString("en-IN");


document.getElementById(
"billMonth"
).innerText =
document.getElementById("month").value
+
" "
+
document.getElementById("year").value;


document.getElementById(
"billDriver"
).innerText =
document.getElementById("driver").value
||
"—";

}


function getBill(){

return{

month:
document.getElementById("month").value
+
" "
+
document.getElementById("year").value,

driver:
document.getElementById("driver").value.trim(),

students:
students.filter(
function(s){
return s.name.trim() !== "";
}
),

total:
students.reduce(
function(total,s){
return total + (Number(s.fee) || 0);
},
0
),

date:
new Date().toLocaleString("en-IN")

};

}


function saveBill(){

let bill =
getBill();


if(bill.students.length===0){

alert(
"Please enter at least one student name."
);

return;

}


savedBills.unshift(bill);


if(savedBills.length>30){

savedBills =
savedBills.slice(0,30);

}


try{

localStorage.setItem(
"transportBills",
JSON.stringify(savedBills)
);

}catch(e){

alert(
"Bill could not be saved in this browser."
);

return;

}


renderSavedBills();


alert(
"✅ Bill saved on this phone."
);

}


function renderSavedBills(){

let box =
document.getElementById(
"savedBills"
);


if(savedBills.length===0){

box.innerText =
"No bills saved yet.";

return;

}


box.innerHTML="";


savedBills.forEach(
function(b,index){

let div =
document.createElement("div");

div.className="saved-bill";


div.innerHTML=`

<div>

<b>
${escapeHTML(b.month)}
</b>

<br>

Driver:
${escapeHTML(b.driver) || "—"}

<br>

Students:
${b.students.length}

<br>

Total:
₹${Number(b.total)
.toLocaleString("en-IN")}

</div>


<button
onclick="loadBill(${index})"
>

Load

</button>

`;


box.appendChild(div);

});

}


function loadBill(index){

let bill =
savedBills[index];


students =
bill.students.map(
function(s){
return {...s};
}
);


let parts =
bill.month.split(" ");


document.getElementById(
"month"
).value =
parts[0] || "September";


document.getElementById(
"year"
).value =
parts.slice(1).join(" ") || "2026";


document.getElementById(
"driver"
).value =
bill.driver || "";


render();


window.scrollTo({

top:0,

behavior:"smooth"

});

}


function shareBill(){

let bill =
getBill();


if(bill.students.length===0){

alert(
"Please enter at least one student name."
);

return;

}


let text =
"AMICHAND SERVODAY CONVENT SCHOOL\n"
+
"TRANSPORT FEE BILL\n\n"
+
"Month: "
+
bill.month
+
"\n"
+
"Driver: "
+
(bill.driver || "—")
+
"\n\n";


bill.students.forEach(
function(s,i){

text +=

(i+1)
+
". "
+
s.name
+
" | Class: "
+
(s.cls || "—")
+
" | Village: "
+
(s.village || "—")
+
" | ₹"
+
Number(s.fee)
.toLocaleString("en-IN")
+
"\n";

});


text +=

"\nGRAND TOTAL: ₹"
+
Number(bill.total)
.toLocaleString("en-IN");


if(
navigator.share
){

navigator.share({

title:
"Transport Fee Bill",

text:text

}).catch(
function(){}
);

}else{

window.open(

"https://wa.me/?text="
+
encodeURIComponent(text),

"_blank"

);

}

}


function clearAll(){

if(
confirm(
"Clear all students?"
)
){

students=[];

render();

}

}


document.getElementById(
"month"
)
.addEventListener(
"change",
updateReceipt
);


document.getElementById(
"year"
)
.addEventListener(
"input",
updateReceipt
);


document.getElementById(
"driver"
)
.addEventListener(
"input",
updateReceipt
);


// Demo students

addStudent(
"Rahul Kumar",
"5th",
"Kherli Bhaw",
1500
);

addStudent(
"Aman Kumar",
"6th",
"Dankaur",
1200
);

addStudent(
"Priya",
"4th",
"Kherli",
1500
);


renderSavedBills();

</script>

</body>
</html>
